<!DOCTYPE html>
<html>
<head>
    <title>Online Examination System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="header">
        <h1>🎓 Online Examination System</h1>
        <p>Test Your Knowledge • Check Your Skills</p>
    </div>

    <div class="container">

        <div class="card">

            <h2>Welcome to Online Exam</h2>

            <p class="text">
                Please enter your details to start the examination.
            </p>

            <label>Student Name</label>
            <input type="text" id="name" placeholder="Enter your name"><br>

            <label>Roll Number</label>
            <input type="text" id="roll" placeholder="Enter your roll number"><br>

            <label>Select Subject</label>

            <select id="subject"><br>
                <option>JavaScript</option>
                <option>HTML</option>
                <option>CSS</option>
                <option>DBMS</option>
            </select>

            <button onclick="startExam()">
                Start Examination →
            </button>

        </div>

    </div>

    <footer>
        © 2026 Online Examination System
    </footer>

    <script src="script.js"></script>

</body>
</html>
